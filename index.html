  font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.16em;font-weight:600;text-transform:uppercase;color:#4a0915;
  background:linear-gradient(180deg,#f6e3a8,#d4b064);box-shadow:0 10px 24px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6);
  animation:glow 2.6s ease-in-out infinite}
.btn svg{width:18px;height:18px}
@keyframes glow{0%,100%{box-shadow:0 10px 24px -10px rgba(0,0,0,.6),0 0 0 0 rgba(236,213,147,.4)}50%{box-shadow:0 10px 24px -10px rgba(0,0,0,.6),0 0 0 10px rgba(236,213,147,0)}}
.togo{margin-top:14px;font-size:.98rem;font-style:italic;color:rgba(246,227,168,.8)}
footer{padding:18px;text-align:center;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.3em;color:rgba(236,213,147,.6);background:#26040b}

/* ---------- link preview render mode (?preview) ---------- */
html.preview,html.preview body{width:1200px;height:630px;overflow:hidden}
html.preview .story,html.preview .closing,html.preview footer,html.preview .progress,html.preview .cue{display:none}
html.preview .hero{min-height:630px;height:630px;flex-direction:row;gap:56px;padding:0 70px}
html.preview .hero::after{display:none}
html.preview .hero-inner{max-width:none;display:grid;grid-template-columns:1fr 400px;grid-template-rows:1fr auto auto auto auto 1fr;column-gap:60px;text-align:center}
html.preview .kicker{grid-row:2}html.preview .hero .names{grid-row:3}html.preview .hero .hook{grid-row:4}html.preview .hero .sub{grid-row:5}
html.preview .hero .names{font-size:88px}
html.preview .hero .hook{font-size:28px}
html.preview .hero .sub{font-size:22px}
html.preview .kicker{font-size:17px}
html.preview .hero-art{grid-column:2;grid-row:1/7;align-self:center;width:400px;margin:0}

@media (prefers-reduced-motion: reduce){.rv{transition:none;opacity:1;transform:none}.floaters,.fx{display:none}.foil{animation:none}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<header class="hero" id="hero">
  <div class="floaters" id="floaters"></div>
  <div class="hero-inner">
    <div class="kicker rv in" id="hKicker"></div>
    <h1 class="names foil rv in" style="--d:.15s"><span id="hHis"></span><span class="amp">&amp;</span><span id="hHers"></span></h1>
    <p class="hook rv in" style="--d:.35s" id="hHook"></p>
    <p class="sub rv in" style="--d:.45s" id="hSub"></p>
    <div class="hero-art rv in" style="--d:.55s"><img id="hImg" alt="Illustration of Mathews and Amala holding hands" width="400" height="340"></div>
  </div>
  <div class="cue">Scroll to begin<i></i></div>
</header>

<main class="story" id="story">
  <div class="line"><b id="lineFill"></b></div>
  <p class="intro rv">Seven little chapters. One big love story.</p>
  <div id="chapters"></div>
</main>

<section class="closing" id="closing">
  <div class="inner">
    <div class="kicker rv" id="cKicker"></div>
    <p class="line2 rv" style="--d:.1s" id="cLine"></p>
    <h2 class="names foil rv" style="--d:.2s" id="cNames"></h2>
    <p class="cta rv" style="--d:.3s" id="cCta"></p>
    <div class="evs rv" style="--d:.4s" id="cEvents"></div>
    <a class="btn rv" style="--d:.5s" id="cBtn" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <span id="cBtnTxt"></span></a>
    <p class="togo rv" style="--d:.6s" id="togo"></p>
  </div>
</section>
<footer>MADE WITH LOVE · M &amp; A</footer>

<script>
(function(){
"use strict";
const S = window.STORY, $ = s => document.querySelector(s);
const PREVIEW = new URLSearchParams(location.search).has("preview");
if (PREVIEW) document.documentElement.classList.add("preview");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WORDS = ["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];

/* hero */
$("#hKicker").textContent = S.hero.kicker; $("#hHis").textContent = S.names.his; $("#hHers").textContent = S.names.hers;
$("#hHook").textContent = S.hero.hook; $("#hSub").textContent = S.hero.sub; $("#hImg").src = S.hero.image;
const fl = $("#floaters");
for (let i = 0; i < 14; i++) { const sp = document.createElement("span");
  sp.style.cssText = `left:${(i * 7.3 + Math.random() * 6) % 100}%;color:${["#e8a0ad","#d6334f","#ecd593"][i % 3]};animation-duration:${9 + Math.random() * 8}s;animation-delay:${-Math.random() * 14}s;transform:scale(${.6 + Math.random() * .8})`;
  fl.appendChild(sp); }

/* delights per chapter */
const CHOC = '<svg class="choc" viewBox="0 0 30 30"><rect x="4" y="6" width="22" height="18" rx="3" fill="#5a3220"/><path d="M11.3 6v18M18.6 6v18M4 15h22" stroke="#3e2014" stroke-width="1.5"/><path d="M4 18 L26 9 V24 H4Z" fill="#c9a24f" opacity=".95"/><path d="M4 18 L26 9" stroke="#f3dfa0" stroke-width="1"/></svg>';
const FX = {
  shutter: () => '<div class="flash"></div><div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#6b0f1f" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>click!</div>',
  eyes: () => '<div class="stars">' + [[58,22,0],[52,30,.15],[64,18,.3],[46,40,.45],[70,26,.2]].map(([x,y,d]) => `<i style="left:${x}%;top:${y}%;animation-delay:${.4 + d}s"></i>`).join("") + '</div>',
  typing: () => '<div class="typing"><i></i><i></i><i></i></div>',
  twist: () => '<div class="stamp">PLOT TWIST</div>',
  chocolates: () => [8,22,40,62,80,90].map((x, i) => CHOC.replace('class="choc"', `class="choc" style="left:${x}%;animation-delay:${.2 + i * .18}s"`)).join(""),
  plane: () => '<svg class="plane" viewBox="0 0 40 22"><path d="M2 11 L30 9 L38 11 L30 13Z M14 10 L8 1 L13 1 L22 10Z M14 12 L8 21 L13 21 L22 12Z M3 11 L0 5 L4 5 L8 10Z" fill="#fffaf0" stroke="#7a5a3a" stroke-width=".9" stroke-linejoin="round"/></svg>',
  hearts: () => Array.from({ length: 9 }, (_, i) => `<i class="fh" style="left:${6 + i * 11}%;animation-delay:${(i * .37) % 3}s;color:${["#d6334f","#e8a0ad","#c9a24f"][i % 3]};transform:scale(${.7 + (i % 3) * .2})"></i>`).join("")
};

/* chapters */
const total = S.chapters.length;
let html = "";
S.chapters.forEach((c, i) => {
  const paras = (Array.isArray(c.text) ? c.text : [c.text]).map(p => `<p>${esc(p)}</p>`).join("");
  html += `<article class="ch" id="ch${i + 1}">
    <div class="node">${i + 1}</div>
    <div class="label rv">Chapter ${WORDS[i] || i + 1}<em> · </em>${esc(c.date)}</div>
    <h2 class="rv" style="--d:.08s">${esc(c.title)}</h2>
    <figure class="art rv" style="--d:.16s;margin:0"><img src="${esc(c.image)}" alt="${esc(c.alt || c.title)}" loading="${i < 2 ? "eager" : "lazy"}" width="400" height="300"><div class="fx">${(FX[c.fx] || (() => ""))()}</div></figure>
    <div class="txt rv${/^[A-Za-z]/.test(c.text[0]||"") ? " dc" : ""}" style="--d:.24s">${paras}${c.hook ? `<div class="cliff">${esc(c.hook)}</div>` : ""}</div>
  </article>`;
  if (S.counter && S.counter.after === i + 1) html += `<div class="counter rv" id="counter"><div class="lbl">${esc(S.counter.label)}<br>${esc(S.counter.sinceText)}</div><span class="num" id="days">0</span><span class="unit">days</span><div class="since">${esc(S.counter.note)}</div><div class="ymd" id="ymd"></div></div>`;
});
$("#chapters").innerHTML = html;

/* days together */
const since = new Date(S.togetherSince + "T00:00:00");
const today = new Date(); today.setHours(0, 0, 0, 0);
const days = Math.round((today - since) / 864e5);
let y = today.getFullYear() - since.getFullYear(), m = today.getMonth() - since.getMonth(), d = today.getDate() - since.getDate();
if (d < 0) { m--; d += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
if (m < 0) { y--; m += 12; }
const ymd = $("#ymd"); if (ymd) ymd.textContent = `${y} years · ${m} months · ${d} days`;
function countUp(){
  const el = $("#days"); if (!el || el.dataset.done) return; el.dataset.done = 1;
  const t0 = performance.now(), dur = 1900;
  const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    el.textContent = Math.round(days * e).toLocaleString("en-IN"); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* closing */
const CL = S.closing;
$("#cKicker").textContent = CL.kicker; $("#cLine").textContent = CL.line; $("#cNames").textContent = S.names.his + " & " + S.names.hers;
$("#cCta").textContent = CL.cta; $("#cBtnTxt").textContent = CL.button; $("#cBtn").href = CL.inviteUrl;
$("#cEvents").innerHTML = CL.events.map((e, i) => (i ? '<div class="sep"></div>' : "") + `<div><h3>${esc(e.title)}</h3><p class="t">${esc(e.time)}</p><p class="p">${esc(e.place)}</p></div>`).join("");
const left = Math.ceil((new Date(CL.weddingDate) - Date.now()) / 864e5);
$("#togo").textContent = left > 0 ? `Only ${left} days to go` : "Today is the day!";

/* reveal on scroll */
const io = new IntersectionObserver(entries => entries.forEach(en => {
  if (!en.isIntersecting) return;
  const t = en.target; t.classList.add("in");
  if (t.id === "counter") countUp();
  io.unobserve(t);
}), { rootMargin: "0px 0px -12% 0px", threshold: .12 });
document.querySelectorAll(".ch, .story .intro, .counter, .closing .rv").forEach(n => io.observe(n));
document.querySelectorAll(".ch .rv").forEach(n => n.classList.remove("rv-pending"));
// chapter delights fire when the picture is well in view
const io2 = new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) { en.target.style.setProperty("--w", en.target.offsetWidth + "px"); en.target.classList.add("go"); io2.unobserve(en.target); }
}), { threshold: .55 });
document.querySelectorAll(".art").forEach(n => io2.observe(n));

/* scroll-driven: progress bar, timeline fill, parallax */
const prog = $("#progress"), fill = $("#lineFill"), story = $("#story"), hero = $("#hero");
const arts = [...document.querySelectorAll(".art img"), $("#hImg")];
let ticking = false;
function onScroll(){
  ticking = false;
  const sy = window.scrollY, vh = innerHeight, max = document.documentElement.scrollHeight - vh;
  prog.style.transform = `scaleX(${max > 0 ? sy / max : 0})`;
  const r = story.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (vh * .6 - r.top) / r.height));
  fill.style.transform = `scaleY(${p})`;
  for (const img of arts) {
    const b = img.parentElement.getBoundingClientRect();
    if (b.bottom < -50 || b.top > vh + 50) continue;
    const c = (b.top + b.height / 2 - vh / 2) / vh;      // -1..1 around viewport centre
    img.style.setProperty("--py", (c * -14).toFixed(2) + "px");
  }
}
window.addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive:true });
window.addEventListener("resize", onScroll);
onScroll();
window.__story = { days };
})();
</script>
</body>
</html>
